name: Validate canonical shader

on:
  push:
    branches:
      - main
      - luminahorizondev
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate canonical Lumina Event Horizon
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select comparison revision
        id: comparison
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_ref="$PR_BASE_SHA"
          else
            git fetch --no-tags origin main
            base_ref="$(git merge-base HEAD origin/main)"
          fi
          echo "base_ref=$base_ref" >> "$GITHUB_OUTPUT"

      - name: Validate canonical package
        run: python3 scripts/validate_canonical.py --base-ref "${{ steps.comparison.outputs.base_ref }}"

      - name: Preprocess water and cloud shader variants
        run: python3 scripts/check_clouds_preprocess.py

      - name: Install GLSL compiler and software OpenGL
        run: sudo apt-get update && sudo apt-get install -y glslang-tools libosmesa6-dev python3-pil

      - name: Compile beta.5 shader variants
        run: /usr/bin/python3 scripts/check_beta5_preprocess.py

      - name: Execute software OpenGL regression checks
        env:
          GALLIUM_DRIVER: llvmpipe
        run: |
          /usr/bin/python3 scripts/check_water_beta3_gpu.py
          /usr/bin/python3 scripts/check_clouds_gpu.py
          /usr/bin/python3 scripts/check_beta5_render.py
